gase:
  methodology_version: "0.2.1-pilot"
  format_preference: "yaml" # "yaml" (recomendado, ligero) o "md"
  control_plane: "GASE_CONTROL.yaml"
  router: "runtime/router.yaml"
  skill_registry: "runtime/skill_registry.yaml"
  context_compiler: "runtime/context_compiler.yaml"
  verification: "runtime/VERIFICATION.md"
  handoff: "runtime/SESSION_HANDOFF.md"

runtime:
  load_policy: "on-demand"
  persistent_memory: "repository"
  external_memory_required: false
  small_work_policy: "direct-when-safe"
